services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finwise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=FinWise AI
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./finwise.db
      - SECRET_KEY=replace-with-a-secure-random-secret-key-finwise-ai-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - LLM_PROVIDER=fallback
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finwise_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
